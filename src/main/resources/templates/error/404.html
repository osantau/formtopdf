<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Page not found</title>
</head>
<body>
  <h1>404 - Page not found</h1>
  <p>The page you’re looking for doesn’t exist.</p>
  <a th:href="@{/}">Go home</a>
  <p>Status: <span th:text="${status}"></span></p>
<p>Error: <span th:text="${error}"></span></p>
<p th:text="${message}"></p>
<p th:text="${path}"></p>
</body>
</html>
