<!DOCTYPE html>
<html  xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Form Data to PDF</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link rel="stylesheet" href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">
            <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
             <script th:src="@{/webjars/tinymce/tinymce.min.js}"></script>
                <script>
        tinymce.init({
            selector: '#message',
            height: 400,
            plugins: 'lists link image table code',
            toolbar: 'undo redo | bold italic | alignleft aligncenter alignright | code'
        });
    </script>
    </head>
    <body>
        <div class="container">
            <h1 class="mb-4">Enter Details</h1>
            <form action="/generate-pdf" th:object="${formDto}" method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Name</label>
                    <input type="text" class="form-control" id="name" name="name" th:field="*{name}" placeholder="Enter Your Name:" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" th:field="*{email}" placeholder="Email:" required>
                </div>
                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control" id="phone" name="phone" th:field="*{phone}" placeholder="Phone Number:" required>
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Message</label>
                    <textarea class="form-control" id="message" name="message" th:field="*{message}" rows="4" placeholder="Enter Your Message:" required></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Vehicle</label>
                    <input type="checkbox" id="vehicle1" name="vehicle1" value="Bike">
                        <label for="vehicle1"> I have a bike</label>
                        <input type="checkbox" id="vehicle2" name="vehicle2" value="Car">&nbsp;
                    <label for="vehicle2"> I have a car</label>
                    <input type="checkbox" id="vehicle3" name="vehicle3" value="Boat">&nbsp;
                    <label for="vehicle3"> I have a boat</label>
                                  </div>
                <button type="submit" name="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </body>

</html>
